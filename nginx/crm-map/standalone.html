<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>经销商地图</title>
  <link id="crm-map-ui-style" rel="stylesheet" href="/crm-map/crm-map.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05070d;
      color: #eef3ff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .crm-standalone-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      background: radial-gradient(ellipse at 50% 40%, rgba(47, 111, 237, 0.18), transparent 55%), #05070d;
      font-size: 13px;
    }
    .crm-standalone-fallback strong {
      font-size: 16px;
      font-weight: 650;
    }
    .crm-standalone-fallback a {
      padding: 7px 12px;
      border: 1px solid rgba(124, 158, 255, 0.35);
      border-radius: 8px;
      color: #dbe6ff;
      text-decoration: none;
    }
    .crm-standalone-fallback a:hover {
      background: rgba(91, 140, 255, 0.16);
    }
  </style>
</head>
<body>
  <div class="crm-standalone-fallback">
    <strong>经销商地图</strong>
    <span>地图已关闭</span>
    <a href="/">返回 CRM</a>
  </div>
  <script src="/crm-map.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (window.__crmMapOpen) window.__crmMapOpen();
    });
  </script>
</body>
</html>
